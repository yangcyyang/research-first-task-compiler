interface:
  display_name: "先查再造 (Research-First Task Compiler)"
  short_description: "Compile fuzzy requests into a task card, research first, present a one-screen option card, then hand off to plan mode."
  default_prompt: "Use $research-first-task-compiler to compile this request: confirm a task card with me first, research existing solutions and quick-read finalist projects, then show me a one-screen option card with your recommendation. After I choose, generate a plan-mode handoff package."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
